name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace
      - name: Test
        run: cargo test --workspace
      - name: Clippy
        run: cargo clippy --workspace --all-targets

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo-audit
        uses: Swatinem/rust-cache@v2
        with:
          key: cargo-audit
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      # `cargo audit` exits non-zero only on real vulnerabilities. Accepted
      # informational warnings are listed in `.cargo/audit.toml` (see
      # docs/security-audit.md). This replaces rustsec/audit-check, which
      # fails the job on unmaintained notices even with zero vulnerabilities.
      - name: Dependency audit (RustSec)
        run: cargo audit
